name: telegram-digest

# 깃허브 내부 예약(schedule)은 무료 등급에서 정시보다 몇 시간씩 늦게 떠서 제거함.
# 대신 외부 스케줄러(cron-job.org)가 매일 한국시간 16:00 정각에
# workflow_dispatch(아래)를 호출해 '즉시' 실행시킨다. 실행은 3~5분이면 끝나 16:05쯤 발송.
# (수동으로 돌리고 싶으면 Actions 탭의 'Run workflow' 버튼을 눌러도 즉시 실행됨)
on:
  workflow_dispatch:

# docs/index.html(웹페이지)을 다시 커밋해 GitHub Pages로 발행하려면 쓰기 권한 필요.
permissions:
  contents: write

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          FOLDER: ${{ secrets.FOLDER }}
          DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SINCE_MIDNIGHT: "false"
          HOURS: "24"
          MAX_IMAGES_PER_CHANNEL: "12"
          SLEEP_BETWEEN_CALLS: "4"
          TZ_NAME: "Asia/Seoul"
          # 항상 즉시 발송(요약 끝나면 바로).
          SEND_AT: "now"
        run: python main.py

      - name: Publish web page (docs/index.html → Pages)
        if: always()
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "다이제스트 웹 갱신 $(TZ=Asia/Seoul date +%F' '%H:%M)"
            git push
            echo "웹페이지 발행 완료"
          else
            echo "docs 변경 없음(새 메시지 없거나 내용 동일) → 발행 생략"
          fi
