name: telegram-digest

on:
  schedule:
    # 06:07 UTC = 15:07 한국시간에 시작. (정각 '0분'은 cron이 몰려 크게 밀리므로
    # 일부러 어중간한 분으로. 요약이 끝나는 즉시 바로 발송 → 대기 없음.)
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: "(이제 예약도 기본 즉시발송. 이 옵션은 무시됨)"
        type: boolean
        default: true

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          FOLDER: ${{ secrets.FOLDER }}
          DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
          SINCE_MIDNIGHT: "false"
          HOURS: "24"
          MAX_IMAGES_PER_CHANNEL: "12"
          SLEEP_BETWEEN_CALLS: "4"
          TZ_NAME: "Asia/Seoul"
          # 항상 즉시 발송(요약 끝나면 바로). 더이상 18:00까지 기다리지 않음.
          SEND_AT: "now"
        run: python main.py
